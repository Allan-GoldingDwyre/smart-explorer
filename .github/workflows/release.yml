# Release : sur chaque tag v*.*.*, publie une GitHub Release avec :
#   - smart-explorer-<version>.vsix  (extension VS Code)
#   - smart-explorer-mcp.js           (serveur MCP stdio autonome, macOS/Linux)
#   - smart-explorer.vsix             (même .vsix, nom stable pour install.sh)
#   - skills.tar.gz                   (skills pour Claude Code / Vibe)
#   - install.sh                      (installeur interactif curl|bash)
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:mcp
      - run: npx vsce package
      - run: tar -czf skills.tar.gz -C skills smart-explorer smart-explorer-baby-steps

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "smart-explorer $VERSION" \
            --notes "Extension VS Code (vsix), serveur MCP stdio autonome et skills. Installation : curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash" \
            "smart-explorer-${VERSION}.vsix" \
            "smart-explorer-${VERSION}.vsix#smart-explorer.vsix" \
            skills.tar.gz \
            dist/smart-explorer-mcp.js \
            install.sh
